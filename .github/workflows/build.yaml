# Builds the backend and frontend images and pushes them to GHCR
# (ghcr.io/mill-prj/lzb-moe-{backend,frontend}).
#
# Deploying a new build = updating the pinned digests in kube-infra
# (apps/lzb-moe/production). The digests are printed in each job summary.
name: build

on:
  push:
    branches: [main]
    paths:
      - lzb-moe-backend/**
      - lzb-moe-frontend/**
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mill-prj/lzb-moe-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lzb-moe-${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "ghcr.io/mill-prj/lzb-moe-${{ matrix.component }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
