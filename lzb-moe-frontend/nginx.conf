# Replaces the image's /etc/nginx/conf.d/default.conf (included inside http {}).
# nginx-unprivileged runs as uid 101 and cannot bind below 1024, so it listens on
# 8080 (HTTP) and 8443 (HTTPS); the Kubernetes Service maps 80→8080 and 443→8443.
# TLS is terminated here with the cert-manager certificate mounted at /tls.

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://lzb.moe$request_uri;
    }
}

ssl_certificate     /tls/tls.crt;
ssl_certificate_key /tls/tls.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:1m;
ssl_session_timeout 1d;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name www.lzb.moe;

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 301 https://lzb.moe$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name lzb.moe;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # A location that sets any add_header inherits none from its parent,
    # so each location states its full header set.

    # /metrics is scraped by Prometheus inside the cluster only.
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
